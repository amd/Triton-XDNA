name: "Build triton-xdna"

inputs:
  rebuild_flags:
    required: false
    default: ""
  env_name:
    required: false
    default: "ci_env"
  cmake_extra_flags:
    required: false
    default: ""

runs:
  using: "composite"
  steps:
  #  - name: Ccache for C++ compilation
  #    uses: hendrikmuhs/ccache-action@v1.2.12
  #    with:
  #      key: ${{ runner.os }}-clangreleaseasserts-${{ steps.get-submodule-hash.outputs.hash }}
  #      max-size: 1G
  #  - name: Install packages
  #    run: |
  #     sudo apt-get install -y ninja-build build-essential cmake
   - name: Create virtual environment
     env:
       HOME: /workspace
     shell: bash
     run: |
      python3 -m venv ${{ inputs.env_name }}

   - name: Install python packages
     env:
       HOME: /workspace
     shell: bash
     run: |
      source ${{ inputs.env_name }}/bin/activate
      pip install --no-cache-dir --upgrade pip setuptools wheel
      pip install --no-cache-dir lit cmake joblib pybind11 nanobind
      pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

   - name: Install MLIR-AIR (with mlir-aie + llvm-aie via [aie] extra)
     env:
       HOME: /workspace
     shell: bash
     run: |
      source ${{ inputs.env_name }}/bin/activate
      # The mlir-air wheel pins the matching mlir-aie commit and requires
      # llvm-aie via the [aie] extra, so a single pip install pulls the whole
      # stack with a guaranteed-compatible mlir-aie.
      MLIR_AIR_HASH_FILE=utils/mlir-air-hash.txt
      MLIR_AIR_COMMIT_HASH=$(awk -v kw="Commit:" '$0 ~ kw {for (i=1; i<NF; i++) if ($i == kw) print $(i+1)}' "$MLIR_AIR_HASH_FILE")
      SHORT_MLIR_AIR_COMMIT_HASH="${MLIR_AIR_COMMIT_HASH:0:7}"
      echo "Using mlir-air hash: $SHORT_MLIR_AIR_COMMIT_HASH"
      MLIR_AIR_VERSION=$(awk -v kw="Version:" '$0 ~ kw {for (i=1; i<NF; i++) if ($i == kw) print $(i+1)}' "$MLIR_AIR_HASH_FILE")
      echo "mlir-air version: $MLIR_AIR_VERSION"
      MLIR_AIR_TIMESTAMP=$(awk -v kw="Timestamp:" '$0 ~ kw {for (i=1; i<NF; i++) if ($i == kw) print $(i+1)}' "$MLIR_AIR_HASH_FILE")
      echo "mlir-air timestamp: $MLIR_AIR_TIMESTAMP"
      python3 -m pip install "mlir_air[aie]==$MLIR_AIR_VERSION.$MLIR_AIR_TIMESTAMP+$SHORT_MLIR_AIR_COMMIT_HASH.no.rtti" \
          -f https://github.com/Xilinx/mlir-air/releases/expanded_assets/latest-air-wheels-no-rtti \
          -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/latest-wheels-no-rtti-2 \
          -f https://github.com/Xilinx/llvm-aie/releases/expanded_assets/nightly
      # The [aie] extra requires llvm-aie without a version pin. Force an
      # upgrade so we always test against the latest nightly wheel.
      python3 -m pip install --no-cache-dir --upgrade --force-reinstall llvm-aie -f https://github.com/Xilinx/llvm-aie/releases/expanded_assets/nightly
      python3 -m pip show llvm-aie
      python3 -m pip show mlir_aie_no_rtti
      # Set environmental variable "MLIR_AIE_INSTALL_DIR"
      MLIR_AIE_INSTALL_DIR_STR="$(python3 -m pip show mlir_aie_no_rtti | grep ^Location: | awk '{print $2}')/mlir_aie"
      echo "MLIR_AIE_INSTALL_DIR=$MLIR_AIE_INSTALL_DIR_STR" >> $GITHUB_ENV
      # Update paths in environmental variables
      echo "${MLIR_AIE_INSTALL_DIR_STR}/bin" >> $GITHUB_PATH
      echo "PYTHONPATH=${MLIR_AIE_INSTALL_DIR_STR}/python${PYTHONPATH:+:$PYTHONPATH}" >> $GITHUB_ENV
      echo "LD_LIBRARY_PATH=${MLIR_AIE_INSTALL_DIR_STR}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV

   - name: Make the host-mounted XRT tools runnable
     env:
       HOME: /workspace
     shell: bash
     run: |
      # XRT is bind-mounted read-only from the CI host, but its runtime deps
      # are not, and the runner image does not ship them: xrt-smi links
      # against libboost_filesystem/libboost_program_options and otherwise
      # dies with "error while loading shared libraries" (exit 127), which
      # makes every XRT query report no NPU. mlir-air's CI installs boost
      # with `sudo apt-get install libboost-all-dev`, but that only works on
      # GitHub-hosted runners; this container is a non-root user with no
      # sudo, so fall back to unpacking the packages into $HOME.
      XRT_ROOT="${XILINX_XRT:-/opt/xilinx/xrt}"
      XRT_SMI="$XRT_ROOT/bin/unwrapped/xrt-smi"
      if [ ! -x "$XRT_SMI" ]; then
        echo "No $XRT_SMI found; skipping"
        exit 0
      fi
      if "$XRT_ROOT/bin/xrt-smi" --version >/dev/null 2>&1; then
        echo "xrt-smi already runs; nothing to install"
        exit 0
      fi

      MISSING=$(ldd "$XRT_SMI" 2>/dev/null | awk '/not found/ {print $1}')
      if [ -z "$MISSING" ]; then
        echo "WARNING: xrt-smi fails for a reason other than missing libraries:"
        "$XRT_ROOT/bin/xrt-smi" --version || true
        exit 0
      fi
      echo "Missing shared libraries: $MISSING"

      # libboost_filesystem.so.1.83.0 -> libboost-filesystem1.83.0, so a boost
      # version bump on the host does not need a change here.
      PKGS=""
      for lib in $MISSING; do
        case "$lib" in
          libboost_*)
            base="${lib%%.so.*}"
            ver="${lib##*.so.}"
            PKGS="$PKGS $(echo "$base" | tr '_' '-')${ver}"
            ;;
          *) echo "WARNING: no package mapping known for $lib" ;;
        esac
      done
      if [ -z "$PKGS" ]; then
        echo "WARNING: nothing installable; leaving xrt-smi broken"
        exit 0
      fi
      echo "Installing:$PKGS"

      if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
        sudo apt-get update -qq && sudo apt-get install -y $PKGS
      else
        PREFIX="$HOME/xrt-deps"
        APT="$HOME/.aptwork"
        mkdir -p "$APT/lists/partial" "$APT/cache/archives/partial" "$PREFIX"
        APTOPTS="-o Dir::State::Lists=$APT/lists -o Dir::Cache=$APT/cache -o Debug::NoLocking=1"
        apt-get $APTOPTS update -qq
        cd "$PREFIX"
        apt-get $APTOPTS download $PKGS
        for d in *.deb; do dpkg -x "$d" "$PREFIX"; done
        cd - >/dev/null
        BOOST_LIB="$PREFIX/usr/lib/x86_64-linux-gnu"
        NEW_LD_PATH="$BOOST_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        export LD_LIBRARY_PATH="$NEW_LD_PATH"
        echo "LD_LIBRARY_PATH=$NEW_LD_PATH" >> $GITHUB_ENV
      fi

      "$XRT_ROOT/bin/xrt-smi" --version && echo "xrt-smi OK" \
        || echo "WARNING: xrt-smi still not runnable"

   - name: Build
     env:
       HOME: /workspace
     shell: bash
     run: |
      source ${{ inputs.env_name }}/bin/activate
      mkdir build
      cmake -GNinja -S . -Bbuild 
      ninja -Cbuild
