name: "Run test suite"

inputs:
  env_name:
    required: false
    default: "ci_env"
  device:
    description: >
      Target device architecture: aie2 (npu1) or aie2p (npu2).
      Leave empty to detect it from the NPU the runner actually has.
    required: false
    default: ""


runs:
  using: "composite"
  steps:
    - name: Test
      env:
        HOME: /workspace
      shell: "bash"
      run: |
        set -x  # Enable command tracing
        
        echo ""
        echo "=========================================="
        echo "STEP 1: Source XRT"
        echo "=========================================="
        if [ -f /opt/xilinx/xrt/setup.sh ]; then
          echo "XRT setup.sh found, sourcing..."
          source /opt/xilinx/xrt/setup.sh
        else
          echo "ERROR: XRT setup.sh not found!"
          exit 1
        fi
        
        echo ""
        echo "=========================================="
        echo "STEP 2: Activate Virtual Environment"
        echo "=========================================="
        if [ -f "${{ inputs.env_name }}/bin/activate" ]; then
          echo "Virtual environment found at ${{ inputs.env_name }}"
          source ${{ inputs.env_name }}/bin/activate
        else
          echo "ERROR: Virtual environment not found at ${{ inputs.env_name }}"
          ls -la
          exit 1
        fi
        
        echo ""
        echo "=========================================="
        echo "STEP 3: Check for utils/env_setup.sh"
        echo "=========================================="
        if [ -f utils/env_setup.sh ]; then
          echo "env_setup.sh found"
          
          # Set MLIR_AIE_INSTALL_DIR first to skip reinstallation. The build
          # step already exports it via GITHUB_ENV; only resolve it here if it
          # is unset. The [aie] extra installs the no-RTTI wheel (dist name:
          # mlir_aie_no_rtti), so try that name before the RTTI one.
          echo "Setting MLIR_AIE_INSTALL_DIR..."
          if [ -z "$MLIR_AIE_INSTALL_DIR" ]; then
            MLIR_AIE_LOCATION="$(python3 -m pip show mlir_aie_no_rtti 2>/dev/null | grep ^Location: | awk '{print $2}')"
            if [ -z "$MLIR_AIE_LOCATION" ]; then
              MLIR_AIE_LOCATION="$(python3 -m pip show mlir_aie 2>/dev/null | grep ^Location: | awk '{print $2}')"
            fi
            if [ -z "$MLIR_AIE_LOCATION" ]; then
              echo "ERROR: could not locate an installed mlir_aie(_no_rtti) package."
              exit 1
            fi
            export MLIR_AIE_INSTALL_DIR="${MLIR_AIE_LOCATION}/mlir_aie"
          fi
          echo "MLIR_AIE_INSTALL_DIR: $MLIR_AIE_INSTALL_DIR"
          
          echo "Sourcing env_setup.sh..."
          source utils/env_setup.sh
        else
          echo "WARNING: utils/env_setup.sh not found, skipping"
        fi
        
        echo ""
        echo "=========================================="
        echo "STEP 4: Set LLVM_BINARY_DIR"
        echo "=========================================="
        
        LLVM_BIN_PATH=$(find ~/.triton/llvm/ -name bin 2>/dev/null | head -1)
        if [ -n "$LLVM_BIN_PATH" ]; then
          export LLVM_BINARY_DIR="$LLVM_BIN_PATH"
          echo "LLVM_BINARY_DIR set to: $LLVM_BINARY_DIR"
        else
          echo "WARNING: LLVM bin directory not found"
        fi
        
        echo ""
        echo "=========================================="
        echo "STEP 5: Set Triton-XDNA PYTHONPATH"
        echo "=========================================="
        TRITON_LOCATION=$(python -m pip show triton_xdna 2>/dev/null | awk '/^Location:/ {print $2}')
        if [ -n "$TRITON_LOCATION" ]; then
          echo "Triton found at: $TRITON_LOCATION"
          if [ -d "${TRITON_LOCATION}/triton/mlir_air/python" ]; then
            export PYTHONPATH="${TRITON_LOCATION}/triton/mlir_air/python:$PYTHONPATH"
            echo "Added to PYTHONPATH: ${TRITON_LOCATION}/triton/mlir_air/python"
          else
            echo "WARNING: mlir_air/python not found in Triton location"
            ls -la "${TRITON_LOCATION}/triton/" 2>/dev/null || echo "triton directory not found"
          fi
        else
          echo "WARNING: Triton package not found"
        fi
        
        echo ""
        echo "=========================================="
        echo "STEP 6: Set TRITON_SHARED_OPT_PATH"
        echo "=========================================="
        echo "Searching for triton-shared-opt..."
        TRITON_SHARED_OPT=$(find "$GITHUB_WORKSPACE/third_party/triton/build" -name triton-shared-opt 2>/dev/null | head -1)
        if [ -n "$TRITON_SHARED_OPT" ]; then
          export TRITON_SHARED_OPT_PATH="$TRITON_SHARED_OPT"
          echo "TRITON_SHARED_OPT_PATH set to: $TRITON_SHARED_OPT_PATH"
        else
          echo "WARNING: triton-shared-opt not found"
          echo "Checking build directory..."
          ls -la "$GITHUB_WORKSPACE/third_party/triton/build" 2>/dev/null || echo "Build directory not found"
        fi
        
        echo ""
        echo "=========================================="
        echo "STEP 7: Final Environment Summary"
        echo "=========================================="
        echo "LLVM_BINARY_DIR: $LLVM_BINARY_DIR"
        echo "TRITON_SHARED_OPT_PATH: $TRITON_SHARED_OPT_PATH"
        echo "MLIR_AIE_INSTALL_DIR: $MLIR_AIE_INSTALL_DIR"
        echo "PYTHONPATH: $PYTHONPATH"
        echo "PATH: $PATH"
        echo "LD_LIBRARY_PATH: $LD_LIBRARY_PATH"
        # Report what XRT sees, so a missing/unavailable NPU is obvious in the
        # log instead of surfacing as a per-test "No NPU devices found".
        echo "--- xrt version ---"
        xrt-smi --version || echo "WARNING: xrt-smi --version failed"
        echo "--- xrt-smi examine (exit status reported below) ---"
        xrt-smi examine && echo "xrt-smi examine exit: 0" \
          || echo "xrt-smi examine exit: $? (non-zero)"
        ls -l /dev/accel/ || echo "WARNING: /dev/accel not present in container"
        # Probe the XRT API the same way the driver now does, so the device
        # name is in the log even when the suite never gets that far.
        echo "--- pyxrt device probe ---"
        python -c "
        import pyxrt
        d = pyxrt.device(0)
        print('pyxrt device name:', repr(d.get_info(pyxrt.xrt_info_device.name)))
        " || echo "WARNING: pyxrt device probe failed"

        echo ""
        echo "=========================================="
        echo "STEP 7b: ROCm torch diagnostic probe"
        echo "=========================================="
        # Every example segfaults (exit -11) at import with no traceback; narrow
        # down where ROCm torch dies. Each probe is non-fatal (|| echo) so we see
        # all of them in one run. Order matters: the examples import torch before
        # triton, so replicate that too.
        echo "--- probe 1: bare torch import ---"
        python -c "import torch; print('torch import ok', torch.__version__)" \
          || echo "PROBE FAIL: bare torch import rc=$?"
        echo "--- probe 2: torch then triton (example import order) ---"
        python -c "import torch; import triton; from triton.backends.amd_triton_npu.driver import NPUDriver; print('torch+triton import ok')" \
          || echo "PROBE FAIL: torch+triton import rc=$?"
        echo "--- probe 3: HIP device query ---"
        python -c "import torch; print('hip avail:', torch.cuda.is_available(), (torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'none'))" \
          || echo "PROBE FAIL: hip device query rc=$?"
        echo "--- probe 4: HIP compute, no override ---"
        python -c "import torch; print('compute ok', torch.randn(4, device='cuda').sum().item())" \
          || echo "PROBE FAIL: hip compute (no override) rc=$?"
        echo "--- probe 5: HIP compute, HSA_OVERRIDE_GFX_VERSION=11.5.1 ---"
        HSA_OVERRIDE_GFX_VERSION=11.5.1 python -c "import torch; print('compute ok', torch.randn(4, device='cuda').sum().item())" \
          || echo "PROBE FAIL: hip compute (override 11.5.1) rc=$?"

        echo ""
        echo "=========================================="
        echo "STEP 8: Run Tests"
        echo "=========================================="
        # Pick the tiling scripts that match the NPU this runner actually has.
        # Hard-coding aie2 ran the 8-core AIE2 schedules against AIE2P silicon
        # (e.g. Krackan), which fails in aiecc rather than at detection.
        DEVICE="${{ inputs.device }}"
        if [ -z "$DEVICE" ]; then
          DEVICE=$(python -c "
        import pyxrt
        # Mirrors NPU_MODELS in the driver / mlir-aie's hostruntime.
        ARCH = {
            'aie2': ['npu1', 'Phoenix'],
            'aie2p': ['npu4', 'Strix', 'npu5', 'Strix Halo', 'npu6', 'Krackan'],
        }
        name = pyxrt.device(0).get_info(pyxrt.xrt_info_device.name)
        print(next(a for a, kws in ARCH.items()
                   if any(k.lower() in name.lower() for k in kws)))
        ") || {
            echo "ERROR: could not detect the NPU architecture. Pass the"
            echo "       'device' input explicitly (aie2 or aie2p)."
            exit 1
          }
          echo "Auto-detected device architecture: $DEVICE"
        fi
        echo "Target device: $DEVICE"
        python scripts/run_tests.py --device "$DEVICE" --verbose --timeout 1200

        echo ""
        echo "=========================================="
        echo "STEP 9: LLM examples in NPU-only mode"
        echo "=========================================="
        # gpt2/qwen are the end-to-end iGPU-free gate. They default to --backend npu
        # if the HuggingFace hub is unreachable the examples exit 77 = SKIP.
        pip install --no-cache-dir transformers numpy ml_dtypes
        CUDA_VISIBLE_DEVICES="" HIP_VISIBLE_DEVICES="" ROCR_VISIBLE_DEVICES="" \
          python scripts/run_tests.py --device "$DEVICE" --verbose --timeout 1200 \
            -t gpt2 -t qwen2_5

        echo ""
        echo "=========================================="
        echo "STEP 10: LLM examples in hetero mode (iGPU + NPU)"
        echo "=========================================="
        # Same gpt2/qwen examples, now in --backend hetero
        # HSA_OVERRIDE_GFX_VERSION=11.5.1
        # is required before any iGPU run so the rocm7.14 torch wheel targets
        # gfx1151 (Strix Halo). 
        if [ "$DEVICE" = "aie2p" ]; then
          export HSA_OVERRIDE_GFX_VERSION=11.5.1
          hetero_rc=0
          for ex in gpt2 qwen2_5; do
            echo "--- hetero: $ex ---"
            entry=$(ls examples/$ex/*_inference.py | head -1)
            ( cd "examples/$ex" && python "$(basename "$entry")" --backend hetero --max-tokens 0 --verbose )
            rc=$?
            if [ "$rc" -eq 77 ]; then
              echo "SKIP: $ex (exit 77)"
            elif [ "$rc" -ne 0 ]; then
              echo "FAIL: $ex (exit $rc)"
              hetero_rc=1
            fi
          done
          exit $hetero_rc
        else
          echo "Skipping hetero run: gpt2/qwen are npu2-only (device=$DEVICE)."
        fi
