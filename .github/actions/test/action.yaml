name: "Run test suite"

inputs:
  env_name:
    required: false
    default: "ci_env"
  device:
    description: >
      Target device architecture: aie2 (npu1) or aie2p (npu2).
      Leave empty to detect it from the NPU the runner actually has.
    required: false
    default: ""


runs:
  using: "composite"
  steps:
    - name: Test
      env:
        HOME: /workspace
      shell: "bash"
      run: |
        set -x  # Enable command tracing
        
        echo ""
        echo "=========================================="
        echo "STEP 1: Source XRT"
        echo "=========================================="
        if [ -f /opt/xilinx/xrt/setup.sh ]; then
          echo "XRT setup.sh found, sourcing..."
          source /opt/xilinx/xrt/setup.sh
        else
          echo "ERROR: XRT setup.sh not found!"
          exit 1
        fi
        
        echo ""
        echo "=========================================="
        echo "STEP 2: Activate Virtual Environment"
        echo "=========================================="
        if [ -f "${{ inputs.env_name }}/bin/activate" ]; then
          echo "Virtual environment found at ${{ inputs.env_name }}"
          source ${{ inputs.env_name }}/bin/activate
        else
          echo "ERROR: Virtual environment not found at ${{ inputs.env_name }}"
          ls -la
          exit 1
        fi
        
        echo ""
        echo "=========================================="
        echo "STEP 3: Check for utils/env_setup.sh"
        echo "=========================================="
        if [ -f utils/env_setup.sh ]; then
          echo "env_setup.sh found"
          
          # Set MLIR_AIE_INSTALL_DIR first to skip reinstallation. The build
          # step already exports it via GITHUB_ENV; only resolve it here if it
          # is unset. The [aie] extra installs the no-RTTI wheel (dist name:
          # mlir_aie_no_rtti), so try that name before the RTTI one.
          echo "Setting MLIR_AIE_INSTALL_DIR..."
          if [ -z "$MLIR_AIE_INSTALL_DIR" ]; then
            MLIR_AIE_LOCATION="$(python3 -m pip show mlir_aie_no_rtti 2>/dev/null | grep ^Location: | awk '{print $2}')"
            if [ -z "$MLIR_AIE_LOCATION" ]; then
              MLIR_AIE_LOCATION="$(python3 -m pip show mlir_aie 2>/dev/null | grep ^Location: | awk '{print $2}')"
            fi
            if [ -z "$MLIR_AIE_LOCATION" ]; then
              echo "ERROR: could not locate an installed mlir_aie(_no_rtti) package."
              exit 1
            fi
            export MLIR_AIE_INSTALL_DIR="${MLIR_AIE_LOCATION}/mlir_aie"
          fi
          echo "MLIR_AIE_INSTALL_DIR: $MLIR_AIE_INSTALL_DIR"
          
          echo "Sourcing env_setup.sh..."
          source utils/env_setup.sh
        else
          echo "WARNING: utils/env_setup.sh not found, skipping"
        fi
        
        echo ""
        echo "=========================================="
        echo "STEP 4: Set LLVM_BINARY_DIR"
        echo "=========================================="
        
        LLVM_BIN_PATH=$(find ~/.triton/llvm/ -name bin 2>/dev/null | head -1)
        if [ -n "$LLVM_BIN_PATH" ]; then
          export LLVM_BINARY_DIR="$LLVM_BIN_PATH"
          echo "LLVM_BINARY_DIR set to: $LLVM_BINARY_DIR"
        else
          echo "WARNING: LLVM bin directory not found"
        fi
        
        echo ""
        echo "=========================================="
        echo "STEP 5: Set Triton-XDNA PYTHONPATH"
        echo "=========================================="
        TRITON_LOCATION=$(python -m pip show triton_xdna 2>/dev/null | awk '/^Location:/ {print $2}')
        if [ -n "$TRITON_LOCATION" ]; then
          echo "Triton found at: $TRITON_LOCATION"
          if [ -d "${TRITON_LOCATION}/triton/mlir_air/python" ]; then
            export PYTHONPATH="${TRITON_LOCATION}/triton/mlir_air/python:$PYTHONPATH"
            echo "Added to PYTHONPATH: ${TRITON_LOCATION}/triton/mlir_air/python"
          else
            echo "WARNING: mlir_air/python not found in Triton location"
            ls -la "${TRITON_LOCATION}/triton/" 2>/dev/null || echo "triton directory not found"
          fi
        else
          echo "WARNING: Triton package not found"
        fi
        
        echo ""
        echo "=========================================="
        echo "STEP 6: Set TRITON_SHARED_OPT_PATH"
        echo "=========================================="
        echo "Searching for triton-shared-opt..."
        TRITON_SHARED_OPT=$(find "$GITHUB_WORKSPACE/third_party/triton/build" -name triton-shared-opt 2>/dev/null | head -1)
        if [ -n "$TRITON_SHARED_OPT" ]; then
          export TRITON_SHARED_OPT_PATH="$TRITON_SHARED_OPT"
          echo "TRITON_SHARED_OPT_PATH set to: $TRITON_SHARED_OPT_PATH"
        else
          echo "WARNING: triton-shared-opt not found"
          echo "Checking build directory..."
          ls -la "$GITHUB_WORKSPACE/third_party/triton/build" 2>/dev/null || echo "Build directory not found"
        fi
        
        echo ""
        echo "=========================================="
        echo "STEP 7: Final Environment Summary"
        echo "=========================================="
        echo "LLVM_BINARY_DIR: $LLVM_BINARY_DIR"
        echo "TRITON_SHARED_OPT_PATH: $TRITON_SHARED_OPT_PATH"
        echo "MLIR_AIE_INSTALL_DIR: $MLIR_AIE_INSTALL_DIR"
        echo "PYTHONPATH: $PYTHONPATH"
        echo "PATH: $PATH"
        echo "LD_LIBRARY_PATH: $LD_LIBRARY_PATH"
        # Report what XRT sees, so a missing/unavailable NPU is obvious in the
        # log instead of surfacing as a per-test "No NPU devices found".
        # Host memory, so a model that declines for lack of it leaves the
        # number it declined against in the log. The Q4NX prefills dequantize
        # to bf16 on the host and the largest needs tens of GiB; without this
        # the only evidence of an undersized runner is an exit 137.
        echo "--- host memory ---"
        grep -E "^(MemTotal|MemAvailable):" /proc/meminfo || true
        echo "--- xrt version ---"
        xrt-smi --version || echo "WARNING: xrt-smi --version failed"
        echo "--- xrt-smi examine (exit status reported below) ---"
        xrt-smi examine && echo "xrt-smi examine exit: 0" \
          || echo "xrt-smi examine exit: $? (non-zero)"
        ls -l /dev/accel/ || echo "WARNING: /dev/accel not present in container"
        # Probe the XRT API the same way the driver now does, so the device
        # name is in the log even when the suite never gets that far.
        echo "--- pyxrt device probe ---"
        python -c "
        import pyxrt
        d = pyxrt.device(0)
        print('pyxrt device name:', repr(d.get_info(pyxrt.xrt_info_device.name)))
        " || echo "WARNING: pyxrt device probe failed"

        echo ""
        echo "=========================================="
        echo "STEP 8: Run Tests"
        echo "=========================================="
        # Pick the tiling scripts that match the NPU this runner actually has.
        # Hard-coding aie2 ran the 8-core AIE2 schedules against AIE2P silicon
        # (e.g. Krackan), which fails in aiecc rather than at detection.
        DEVICE="${{ inputs.device }}"
        if [ -z "$DEVICE" ]; then
          DEVICE=$(python -c "
        import pyxrt
        # Mirrors NPU_MODELS in the driver / mlir-aie's hostruntime.
        ARCH = {
            'aie2': ['npu1', 'Phoenix'],
            'aie2p': ['npu4', 'Strix', 'npu5', 'Strix Halo', 'npu6', 'Krackan'],
        }
        name = pyxrt.device(0).get_info(pyxrt.xrt_info_device.name)
        print(next(a for a, kws in ARCH.items()
                   if any(k.lower() in name.lower() for k in kws)))
        ") || {
            echo "ERROR: could not detect the NPU architecture. Pass the"
            echo "       'device' input explicitly (aie2 or aie2p)."
            exit 1
          }
          echo "Auto-detected device architecture: $DEVICE"
        fi
        echo "Target device: $DEVICE"
        CUDA_VISIBLE_DEVICES="" HIP_VISIBLE_DEVICES="" ROCR_VISIBLE_DEVICES="" \
          python scripts/run_tests.py --device "$DEVICE" --verbose --timeout 1200

        echo ""
        echo "=========================================="
        echo "STEP 9: LLM examples in NPU-only mode"
        echo "=========================================="
        # gpt2/qwen are the end-to-end iGPU-free gate. They default to --backend npu
        # if the HuggingFace hub is unreachable the examples exit 77 = SKIP.
        pip install --no-cache-dir transformers numpy ml_dtypes
        CUDA_VISIBLE_DEVICES="" HIP_VISIBLE_DEVICES="" ROCR_VISIBLE_DEVICES="" \
          python scripts/run_tests.py --device "$DEVICE" --verbose --timeout 1200 \
            -t gpt2 -t qwen2_5

        echo ""
        echo "=========================================="
        echo "STEP 9b: Q4NX prefill gates"
        echo "=========================================="
        # Invoked directly rather than through run_tests.py, which would run the
        # entry point with no arguments and so try to generate -- and generation
        # needs a one-time `make compile-decode`. --prefill-only needs no decode
        # build and is the stronger signal anyway: it gates on the canonical
        # prompt's first token, so a wrong kernel fails here rather than being
        # absorbed into fluent-looking output. npu2-only, like gpt2/qwen.
        # Outside the device guard, and before everything else here: this checks
        # that `tl.extra.npu` survived the build. Triton's setup.py installs it
        # from amd_triton_npu/language/, so it is a property of the build rather
        # than of the source tree -- and nothing in this repo imports it yet, so
        # a build that stopped installing it would break nothing and be noticed
        # by no one. Needs no NPU, no weights and no mlir-air sources.
        python3 scripts/test_tl_extra_npu.py

        if [ "$DEVICE" = "aie2p" ]; then
          # Which decode artifact the example asks mlir-air for. Needs no NPU,
          # no weights and no mlir-air sources, so it runs before the fetch and
          # unconditionally: --prefill-only below never reaches that code, and
          # a decode run is too heavy for this gate, which would otherwise
          # leave the selection with no coverage at all.
          ( cd examples/llm_q4nx && python3 test_decode_artifact.py )

          # The weight loader lives in mlir-air's sources, which the wheel does
          # not ship, so fetch them at the pinned commit first. Sparse and
          # blobless: ~1.7 MB of two directories. Without this the example
          # declines the test and the gate never actually runs.
          air_rc=0
          python3 utils/fetch_mlir_air_src.py || air_rc=$?
          if [ "$air_rc" -ne 0 ]; then
            echo "SKIP: Q4NX examples (mlir-air sources unavailable)"
          else
            # Reported the way scripts/run_tests.py reports the operator
            # examples -- same markers, same roll-up -- because these used to
            # print raw driver output instead. Searching a CI log for
            # "PASS:" found every operator test and none of these, and the
            # "Total:" above counts only run_tests.py's, so a reader had no
            # way to see that the Q4NX gates ran at all.
            #
            # They are not run *through* run_tests.py because each needs its
            # own arguments: it invokes an entry point bare, which for these
            # means generating, and generation needs a decode build.
            q_pass=0; q_fail=0; q_skip=0

            # gate <example> <args...>
            gate() {
              local ex="$1"; shift
              local rc=0
              echo "📁 Example: $ex"
              echo "   🔄 Running: ${ex}_inference.py $*"
              ( cd "examples/$ex" \
                && CUDA_VISIBLE_DEVICES="" HIP_VISIBLE_DEVICES="" ROCR_VISIBLE_DEVICES="" \
                   python "${ex}_inference.py" "$@" ) || rc=$?
              if [ "$rc" -eq 0 ]; then
                echo "   ✅ PASS: ${ex}_inference.py $*"
                q_pass=$((q_pass + 1))
              elif [ "$rc" -eq 77 ]; then
                echo "   ⏭️  SKIP: ${ex}_inference.py -- example declined (exit 77)"
                q_skip=$((q_skip + 1))
              else
                echo "   ❌ FAIL: ${ex}_inference.py (exit code $rc)"
                q_fail=$((q_fail + 1))
              fi
            }

            # Full inference where it is affordable, prefill-only otherwise. A
            # prefill gate cannot see anything the decode carries -- the
            # builder environment, -DMODEL_TYPE, GLU_SLICE, the core stack,
            # which driver API is used -- and that is most of what a new model
            # adds. The 1B pays 10 s to build its decode and 15 s to generate,
            # so it runs the real thing and compares against recorded ids.
            #
            # The 3B stays prefill-only, and the reason is cost rather than
            # principle: its decode needs a requantized weight cache that a
            # fresh runner does not have, measured at ~7 min. Worth revisiting
            # if that can be cached between runs.
            build_rc=0
            echo "📁 Example: llama32_1b_q4nx (decode build)"
            ( cd examples/llama32_1b_q4nx && make compile-decode ) || build_rc=$?
            if [ "$build_rc" -ne 0 ]; then
              echo "   ❌ FAIL: make compile-decode (exit code $build_rc)"
              q_fail=$((q_fail + 1))
            else
              echo "   ✅ PASS: make compile-decode"
              q_pass=$((q_pass + 1))
              gate llama32_1b_q4nx --max-tokens 8 --greedy
            fi

            gate llama32_3b_q4nx --prefill-only

            # The 8B is prefill-only for the 3B's reason and skips itself for
            # one of its own: its dequantized bf16 weights do not fit every
            # runner, and an undersized host does not raise -- it SIGKILLs the
            # load, which no `except` can turn into a skip. `min_host_gib` is
            # checked before anything is allocated, so this reports SKIP rather
            # than dying at exit 137.
            gate llama31_8b_q4nx --prefill-only

            # Qwen3-4B is prefill-only for the 3B's reason -- its decode needs
            # a requantized weight cache a fresh runner does not have -- and
            # carries a min_host_gib of its own. Its prefill gate is still the
            # first coverage of a non-Llama forward: the per-head qk-norm and
            # the decoupled q dim are both in it.
            gate qwen3_4b_q4nx --prefill-only

            # Qwen3-8B runs the same forward as the 4B, so its gate is not
            # there to cover the block a second time -- it covers the two
            # things the 4B's cannot: an untied LM head (the failure mode is
            # fluent text off a plausible logit vector, which cost a gate
            # failure to find on Llama-3.1-8B) and, in the decode it does not
            # reach here, a core stack and a weight split that are this
            # model's alone. Like the 8B it may decline on min_host_gib; a
            # SKIP is not a PASS.
            gate qwen3_8b_q4nx --prefill-only

            # Qwen2.5-7B, prefill-only, and the one gate here that is not
            # reading a prepared weight bundle: there is no FastFlowLM
            # Qwen2.5-7B NPU2 bundle, so it quantizes an upstream checkpoint on
            # load. That makes it the slowest of these and gives it a
            # min_host_gib of its own, but it is also the only coverage of a
            # biased projection -- every other forward here is y = x @ W.
            gate qwen25_7b_q4nx --prefill-only

            # Qwen2.5-3B, prefill-only. Same forward as the 7B, so its value
            # here is not the block: it is the only model whose decode env sets
            # W_DUAL_CHAN=0, and unlike the 7B it fits the runner, so it is the
            # one Qwen2.5 gate that actually executes rather than declining.
            gate qwen25_3b_q4nx --prefill-only

            # Phi-4-mini, prefill-only. Its gate is the only coverage of a
            # partial rotation: 96 of 128 lanes rotated and the rest copied
            # through, on LongRoPE frequencies. Getting either wrong leaves the
            # head boundary intact and the text fluent, so nothing but the
            # first-token comparison catches it.
            gate phi4_mini_q4nx --prefill-only

            # Gemma3-4B, prefill-only for the same two reasons. Its gate is
            # worth more than the others' despite being the same shape: four
            # bundle conventions, a norm sandwich, dual-theta RoPE and a GELU
            # GLU all have to be right for the first token to come out, and
            # each of them fails into fluent wrong text rather than an error.
            # What it does NOT cover is the 1024-token sliding window -- the
            # canonical prompt is six tokens, so the window never binds. Only
            # the decode comparison against mlir-air's own generation does.
            gate gemma3_4b_q4nx --prefill-only

            # Gemma4-E2B. The widest gate here per token of prompt: the first
            # token cannot come out unless the per-layer embeddings, the
            # per-layer class map (which layers slide, which share a KV cache,
            # which carry the wide FFN), the 1.0 attention scale and the
            # per-layer output scalar are all right, and every one of them
            # fails into fluent wrong text rather than an error.
            #
            # Prefill only, like its siblings, so it does NOT cover the decode
            # -- which on this model is the one built by a different engine.
            # That is `make run` locally.
            gate gemma4_e2b_q4nx --prefill-only

            echo ""
            echo "--------------------------------------------------"
            echo "Q4NX Gate Results:"
            echo "  ✅ Passed:  $q_pass"
            echo "  ❌ Failed:  $q_fail"
            echo "  ⏭️  Skipped: $q_skip"
            echo "  📊 Total:   $((q_pass + q_fail + q_skip))"
            if [ "$q_fail" -ne 0 ]; then
              echo "❌ Q4NX gates failed"
              exit 1
            fi
            echo "🎉 All Q4NX gates passed!"
          fi
        else
          echo "Skipping Q4NX examples: npu2-only (device=$DEVICE)."
        fi

        echo ""
        echo "=========================================="
        echo "STEP 10: LLM examples in hetero mode (iGPU + NPU)"
        echo "=========================================="
        # Same gpt2/qwen examples in --backend hetero (non-NPU ops on the iGPU).
        # HSA_OVERRIDE_GFX_VERSION=11.5.1 is required for iGPU compute
        if [ "$DEVICE" = "aie2p" ]; then
          export HSA_OVERRIDE_GFX_VERSION=11.5.1
          hetero_rc=0
          for ex in gpt2 qwen2_5; do
            echo "--- hetero: $ex ---"
            entry=$(ls examples/$ex/*_inference.py | head -1)
            rc=0
            ( cd "examples/$ex" && python "$(basename "$entry")" --backend hetero --max-tokens 0 --verbose ) || rc=$?
            if [ "$rc" -eq 77 ]; then
              echo "SKIP: $ex (exit 77)"
            elif [ "$rc" -ne 0 ]; then
              echo "FAIL: $ex (exit $rc)"
              hetero_rc=1
            fi
          done
          exit $hetero_rc
        else
          echo "Skipping hetero run: gpt2/qwen are npu2-only (device=$DEVICE)."
        fi
